<script type="text/javascript" template-section="onIncludeEditPrepare">
{
    let node = this;

    $("#node-config-input-role").typedInput({
        type: "role",
        types: [{
            value: "role",
            options: [
                { value: "Member",   label: "Member"   },
                { value: "Observer", label: "Observer" }
            ]
        }]
    });

    $("#cluster-test-connection-btn").on("click", function() {
        let $btn     = $(this);
        let natsText = $("#cluster-test-nats-text");

        $btn.prop("disabled", true);
        natsText.text("Testing...").css("color", "gray");

        $.ajax({
            url: "cluster/testconnection",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                natsAddress: $("#node-config-input-natsAddress").val(),
                natsUser:    $("#node-config-input-natsUser").val() || undefined,
                natsPass:    $("#node-config-input-natsPass").val() || undefined
            }),
            success: function(r) {
                natsText.text((r.nats.ok ? "\u2714 " : "\u2718 ") + (r.nats.message || r.nats.error)).css("color", r.nats.ok ? "green" : "red");
            },
            error: function(xhr) {
                let msg = "Request failed";
                try { msg = JSON.parse(xhr.responseText).error || msg; } catch(e) {}
                natsText.text("\u2718 " + msg).css("color", "red");
            },
            complete: function() { $btn.prop("disabled", false); }
        });
    });
}
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
> **Early development**  this package is still in development. APIs and configuration may change.

Defines a cluster connection. Each Node-RED instance that participates in a cluster needs one **Cluster Config** node per cluster it belongs to.

A single Node-RED instance can belong to multiple clusters simultaneously by creating multiple config nodes with different Root Paths.

### Identity

: *name*        (string) : Display label for this config node.
: *instance id* (string) : Unique name for this Node-RED instance within the cluster (e.g. `field-a`, `control-center`). Must be unique across all instances sharing the same Root Path.
: *role*        (select) : **Member**  full participation; can publish and subscribe. **Observer**  subscribe only; all Cluster Publish nodes linked to this config are silently disabled at runtime.

### Connections

: *NATS address* (string) : Address of the NATS server or leaf node (`host:port`). Defaults to `localhost:4222`.
: *Root Path*   (string)  : Path prefix that identifies this cluster (e.g. `/nodered-cluster`). All instances in the same cluster must use the same value. Multiple independent clusters can share a NATS server by using different Root Paths.
: *username*    (string)  : NATS username for authentication. Leave blank for unauthenticated connections.
: *password*    (string)  : NATS password for authentication. Leave blank for unauthenticated connections.

### Status indicators

| Colour | Meaning |
|--------|---------|
| Yellow ring | Connecting to NATS |
| Green dot   | Connected and registered |
| Red ring    | Connection error or disconnected |
| Grey ring   | Idle (not yet started) |
