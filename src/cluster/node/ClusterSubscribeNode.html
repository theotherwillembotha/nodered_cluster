<script type="text/markdown" template-section="onIncludeDocumentation">
> **Early development** — this package is still in development. APIs and configuration may change.

Subscribes to a cluster subject and emits a Node-RED message each time a matching message arrives from any cluster instance.

### Properties

: *cluster*         (config) : The Cluster Config node that defines which cluster to subscribe to.
: *subject pattern* (string) : Subject pattern to subscribe to. Supports NATS wildcards: `*` matches a single token, `>` matches one or more tokens.

### Subject pattern examples

| Pattern | Matches |
|---------|---------|
| `*.commands.opengate` | Open gate commands from any instance |
| `field-a.>` | All messages from instance `field-a` |
| `>` | Every message in the cluster |
| `field-a.sensors.temperature` | Exact subject from `field-a` only |

The pattern is automatically scoped to the cluster's ZK Root Path, so subjects from other clusters on the same ZooKeeper instance are never mixed in.

### Outputs

: *msg.payload* : The message payload published by the remote Cluster Publish node.
: *msg.topic*   : The full NATS subject the message arrived on.
