<script type="text/javascript" template-section="onIncludeEditPrepare">
{
    let node = this;

    let modeSelect = $("#node-input-mode");

    let updateTtlVisibility = function() {
        let isEphemeral = modeSelect.typedInput("value") === "Ephemeral";
        $("#cluster-publish-ttl-row").toggle(isEphemeral);
    };

    modeSelect.typedInput({
        type: "mode",
        types: [{
            value: "mode",
            options: [
                { value: "Durable",   label: "Durable (delivered eventually)" },
                { value: "Ephemeral", label: "Ephemeral (discard if stale)"   }
            ]
        }]
    });

    modeSelect.on("change", updateTtlVisibility);
    updateTtlVisibility();

    // show observer warning if the linked config is in Observer role.
    let clusterConfigInput = $("#node-input-clusterConfig");
    clusterConfigInput.on("change", function() {
        let configId = clusterConfigInput.val();
        let configNode;
        RED.nodes.eachConfig(function(cfg) { if (cfg.id === configId) configNode = cfg; });
        let isObserver = configNode && configNode.role === "Observer";
        $("#cluster-publish-observer-warning").toggle(!!isObserver);
    });
}
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
> **Early development** — this package is still in development. APIs and configuration may change.

Publishes a message to the cluster when triggered. Other instances with a matching Cluster Subscribe node will receive it.

If the linked cluster config is set to **Observer** role, this node is disabled and will silently discard all messages.

### Properties

: *cluster* (config) : The Cluster Config node that defines which cluster to publish to.
: *subject* (string) : Subject identifier for this message stream (e.g. `commands.opengate`, `sensors.temperature`). Supports dot-notation for hierarchy.
: *mode*    (select) : **Durable** — message is persisted and delivered even if the subscriber is temporarily offline. **Ephemeral** — message is discarded if not delivered within the TTL window. Use for time-sensitive commands.
: *TTL*     (number) : Only shown for Ephemeral mode. Seconds before an undelivered message is discarded. Default: 30.

### Subject routing

The full NATS subject is automatically composed as `<zkRootPath>.<instanceId>.<subject>`, so subjects you define here are automatically namespaced to this instance. Subscribers can use wildcards to match across instances.
</script>
